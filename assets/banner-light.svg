<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sarthak Jain, Software Engineer at Myra AI. 2+ years building in industry, 10 open-source AI projects, 500+ users on auth flows built, 300+ LeetCode problems solved.">
<style>
  .n{font:700 56px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328;letter-spacing:-1.5px}
  .r{font:500 22px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
  .tg{font:400 19px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
  .v{font:700 30px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328;letter-spacing:-.5px}
  .l{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
  .t0{animation:in .6s ease-out 0.00s both}.t1{animation:in .6s ease-out 0.15s both}.t2{animation:in .6s ease-out 0.30s both}.t3{animation:in .6s ease-out 0.45s both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){[class^=t]{animation:none}}
</style>
<rect width="1200" height="300" rx="16" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#d1d9e0"/>
<rect x="56" y="62" width="40" height="4" rx="2" fill="#8250df"/>
<text x="54" y="130" class="n">Sarthak Jain</text>
<text x="56" y="170" class="r">Software Engineer @ Myra AI · Hyderabad, India</text>
<text x="56" y="214" class="tg">Full-stack engineer building GenAI products</text>
<text x="56" y="240" class="tg">that hold up in production.</text>
<g class="t0"><rect x="676" y="56" width="236" height="88" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="696" y="100" class="v">2+</text><text x="696" y="124" class="l">years building in industry</text></g>
<g class="t1"><rect x="928" y="56" width="236" height="88" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="948" y="100" class="v">10</text><text x="948" y="124" class="l">open-source AI projects</text></g>
<g class="t2"><rect x="676" y="160" width="236" height="88" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="696" y="204" class="v">500+</text><text x="696" y="228" class="l">users on auth flows I built</text></g>
<g class="t3"><rect x="928" y="160" width="236" height="88" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="948" y="204" class="v">300+</text><text x="948" y="228" class="l">LeetCode problems solved</text></g>
</svg>