<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sarthak Jain, Software Engineer building GenAI apps that keep working when the model doesn't">
<style>
  .n{font:700 56px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328;letter-spacing:-1.5px}
  .r{font:500 22px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
  .t{font:400 19px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
  .m{font:600 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#1f2328}
  .s{font:500 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#59636e}
  .x1{animation:f1 6s infinite} .x2{animation:f2 6s infinite} .x3{animation:f3 6s infinite}
  .k1{animation:k1 6s infinite} .k2{animation:k2 6s infinite} .k3{animation:k3 6s infinite}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes f1{0%,8%{opacity:.35}12%,30%{opacity:1}36%,100%{opacity:.35}}
  @keyframes f2{0%,36%{opacity:.35}40%,58%{opacity:1}64%,100%{opacity:.35}}
  @keyframes f3{0%,64%{opacity:.35}68%,96%{opacity:1}100%{opacity:.35}}
  @keyframes k1{0%,22%{opacity:0}26%,96%{opacity:1}100%{opacity:0}}
  @keyframes k2{0%,50%{opacity:0}54%,96%{opacity:1}100%{opacity:0}}
  @keyframes k3{0%,78%{opacity:0}82%,96%{opacity:1}100%{opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.x1,.x2,.x3,.k1,.k2,.k3,.cur{animation:none;opacity:1}}
</style>
<rect width="1200" height="300" rx="16" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#d1d9e0"/>
<text x="56" y="112" class="n">Sarthak Jain</text>
<text x="58" y="152" class="r">Software Engineer @ Myra AI · Hyderabad, India</text>
<text x="58" y="196" class="t">I build GenAI apps that keep working</text>
<text x="58" y="222" class="t">when the model doesn't.</text>
<rect x="290" y="207" width="9" height="20" fill="#8250df" class="cur"/>

<text x="700" y="88" class="s">// request → fallback chain</text>
<g class="x1"><rect x="700" y="106" width="140" height="44" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="722" y="134" class="m">gemini</text></g>
<text x="806" y="134" class="m k1" fill="#cf222e" style="fill:#cf222e">503</text>
<path d="M848 128h28" stroke="#d1d9e0" stroke-width="2"/><path d="M872 122l8 6-8 6" fill="none" stroke="#d1d9e0" stroke-width="2"/>
<g class="x2"><rect x="888" y="106" width="120" height="44" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="910" y="134" class="m">groq</text></g>
<text x="966" y="134" class="m k2" style="fill:#cf222e">429</text>
<path d="M1016 128h28" stroke="#d1d9e0" stroke-width="2"/><path d="M1040 122l8 6-8 6" fill="none" stroke="#d1d9e0" stroke-width="2"/>
<g class="x3"><rect x="1056" y="106" width="100" height="44" rx="10" fill="#f6f8fa" stroke="#1a7f37"/><text x="1072" y="134" class="m">offline</text></g>
<g class="k3"><text x="1156" y="184" class="m" text-anchor="end" style="fill:#1a7f37">✓ still answered</text></g>
<text x="700" y="232" class="s">every project below ships with a chain like this</text>
</svg>